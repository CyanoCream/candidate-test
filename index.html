<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beam Analysis Plot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Beam Analysis Calculator</h1>
            <p>Modern structural analysis force & deflection visualizer</p>
        </header>

        <form class="card">
            <div class="form-grid">
                <div class="form-group">
                    <label for="condition">Analysis Condition</label>
                    <div class="input-wrapper">
                        <select name="condition" id="condition">
                            <option value="simply-supported">Simply Supported</option>
                            <option value="two-span-unequal">Two Span Unequal</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="w">Load Force (w)</label>
                    <div class="input-wrapper">
                        <input type="number" id="w" placeholder="e.g. 20" step="any">
                        <span class="unit">kN/m</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="primarySpan">Primary Span (L1)</label>
                    <div class="input-wrapper">
                        <input type="number" id="primarySpan" value="4" step="any">
                        <span class="unit">m</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="secondarySpan">Secondary Span (L2)</label>
                    <div class="input-wrapper">
                        <input type="number" id="secondarySpan" placeholder="e.g. 3" step="any">
                        <span class="unit">m</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="j2">Factor (j2)</label>
                    <div class="input-wrapper">
                        <input type="number" id="j2" value="2" step="any">
                    </div>
                </div>

                <div class="form-group">
                    <label for="EI">Bending Stiffness (EI)</label>
                    <div class="input-wrapper">
                        <input type="number" id="EI" value="3150000000000" step="any">
                        <span class="unit" style="right: 0.5rem; font-size: 0.75rem;">Nmm²</span>
                    </div>
                </div>
            </div>

            <hr class="divider">

            <button type="button" id="calculate" class="btn-primary">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Calculate Analysis
            </button>
        </form>

        <div class="charts-grid" id="chart-container" style="display: none;">
            <div class="card chart-card">
                <canvas id="deflection_plot"></canvas>
            </div>
            <div class="card chart-card">
                <canvas id="shear_force_plot"></canvas>
            </div>
            <div class="card chart-card">
                <canvas id="bending_moment_plot"></canvas>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.js"></script>
    <script src="js/beam-analysis.js"></script>
    <script src="js/analysis-plotter.js"></script>

    <script>
        /**
         * Get float value of specified field
         */
        function floatVal(id) {
            return parseFloat(
                document.getElementById(id).value
            );
        }

        function stringVal(id) {
            return document.getElementById(id).value;
        }

        var plotter = {
            deflection      : new AnalysisPlotter('deflection_plot'),
            shearForce      : new AnalysisPlotter('shear_force_plot'),
            bendingMoment   : new AnalysisPlotter('bending_moment_plot')
        };

        document.getElementById('calculate').addEventListener('click', function(e) {
            try {
                var beam = new Beam();

                beam.primarySpan    = floatVal('primarySpan');
                beam.secondarySpan  = floatVal('secondarySpan');
                beam.material       = new Material('No Name', {
                    EI : floatVal('EI')
                });

                var beamAnalysis        = new BeamAnalysis();
                var deflectionData      = beamAnalysis.getDeflection(beam, floatVal('w'), stringVal('condition'));
                var bendingMomentData   = beamAnalysis.getBendingMoment(beam, floatVal('w'), stringVal('condition'));
                var shearForceData      = beamAnalysis.getShearForce(beam, floatVal('w'), stringVal('condition'));

                plotter.deflection.plot(deflectionData);
                plotter.shearForce.plot(shearForceData);
                plotter.bendingMoment.plot(bendingMomentData);
                
                document.getElementById('chart-container').style.display = 'flex';
            } catch (err) {
                alert("Error: " + err.message);
                console.error(err);
            }
        });
    </script>
    </div>
</body>
</html>
