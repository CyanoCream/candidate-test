<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>3D Illustration Viewer</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
	</head>
	<body>
        <header>
            <div class="title-container">
                <h1>CLT Structure Analysis</h1>
                <p class="subtitle">3D Architectural Illustration</p>
            </div>
        </header>

        <div id="illustration-3d-container"></div>

        <div class="controls-hint">
            <div class="hint-item"><b>Rotate</b> Left Click</div>
            <div class="hint-item"><b>Pan</b> Right Click</div>
            <div class="hint-item"><b>Zoom</b> Scroll</div>
        </div>

        <!-- 3D Renderer -->
        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/",
                    "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.4/build/index.module.js",
                    "three-bvh-csg": "https://unpkg.com/three-bvh-csg@0.0.16/build/index.module.js"
                }
            }
        </script>
        <script type="module" src="js/illustration/illustration-three.js"></script>
    </body>
</html>
